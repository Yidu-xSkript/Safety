name: anchor

on:
  push:
    paths: ['anchor/**', '.github/workflows/anchor.yml']
  pull_request:
    paths: ['anchor/**', '.github/workflows/anchor.yml']

defaults:
  run:
    working-directory: anchor

jobs:
  app:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Goldens are pixel-exact and differ a little per OS; they run locally (see dart_test.yaml).
      - run: flutter test --exclude-tags golden

  backend:
    name: SQL, RLS and Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # PGlite is Postgres compiled to WebAssembly: no Docker, no Supabase account. Installed outside the repo.
      - name: Install PGlite
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y
          npm install @electric-sql/pglite --ignore-scripts --no-audit --no-fund
      - name: Migrations and RLS tests
        run: PGLITE_DIR="$RUNNER_TEMP" node supabase/tests/run.mjs
      - name: Edge Function rules
        run: |
          node --test "supabase/functions/notify/*.test.ts"
          node --test "supabase/functions/delete-account/*.test.ts"
